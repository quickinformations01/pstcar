<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Driver Registration | PST Car</title>

<meta name="description"
content="Become a verified PST Car driver.">

<link rel="stylesheet"
href="../css/registration.css">

</head>

<body>

<!-- ===========================
HEADER
============================ -->

<header class="topbar">

<div class="container">

<a href="../index.html" class="logo">

<div class="logo-icon">🚖</div>

<div>

<h2>PST Car</h2>

<span>Pakistan's Trusted Ride</span>

</div>

</a>

<a href="login.html"
class="login-btn">

Login

</a>

</div>

</header>

<!-- ===========================
PAGE
============================ -->

<section class="register-page">

<div class="container">

<div class="register-card">

<!-- Progress -->

<div class="progress-area">

<div class="progress-header">

<h1>

Become a PST Car Driver

</h1>

<span>

Step 1 of 5

</span>

</div>

<div class="progress">

<div class="progress-fill"></div>

</div>

<p class="subtitle">

Complete your profile to start receiving ride requests.

Your documents will be verified before approval.

</p>

</div>

<!-- Personal Information -->

<div class="section">

<div class="section-title">

<div class="section-number">

1

</div>

<div>

<h2>

Personal Information

</h2>

<p>

Basic information about you

</p>

</div>

</div>

<div class="form-grid">

<div class="form-group">

<label>

Full Name

</label>

<input
type="text"
id="fullName"
placeholder="Muhammad Ali"
required>

</div>

<div class="form-group">

<label>

Mobile Number

</label>

<input
type="tel"
id="mobile"
placeholder="03XXXXXXXXX"
required>

</div>

<div class="form-group">

<label>

Email Address

</label>

<input
type="email"
id="email"
placeholder="example@email.com">

</div>

<div class="form-group">

<label>

City

</label>

<select id="city">

<option value="">Select City</option>

<option>Lahore</option>

<option>Islamabad</option>

<option>Rawalpindi</option>

<option>Faisalabad</option>

<option>Multan</option>

<option>Bahawalpur</option>

<option>Gujranwala</option>

<option>Sialkot</option>

<option>Sargodha</option>

<option>Sheikhupura</option>

<option>Other</option>

</select>

</div>

</div>

</div>

<!-- Continue -->

<div class="actions">

<button
type="button"
class="primary-btn"
id="nextStep">

Continue →

</button>

</div>

</div>

</div>

</section>

<script src="../js/driver-register.js"></script>

</body>

</html>
